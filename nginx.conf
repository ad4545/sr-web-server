pid tmp/nginx/nginx.pid;
error_log tmp/nginx/error.log warn;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log tmp/nginx/access.log;

  # Rate limit: 10 requests per second per client IP
  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream api_core {
    server 127.0.0.1:3002;
  }

  upstream realtime_core {
    server 127.0.0.1:3003;
  }

  server {
    listen 3001;
    server_name _;
    client_max_body_size 10m;

    # Return 429 instead of default 503 when rate limit is exceeded
    limit_req_status 429;

    location = /internal/health {
      add_header Content-Type application/json;
      return 200 '{"service":"ingress","status":"ok"}';
    }

    location /socket.io/ {
      proxy_pass http://realtime_core;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
    }

    location /ws/ {
      rewrite ^/ws/(.*)$ /$1 break;
      proxy_pass http://realtime_core;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
    }

    location /api/ {
      # Allows 10 r/s per IP, with short bursts of 20 requests.
      # nodelay means burst requests are accepted immediately until burst is exceeded.
      limit_req zone=api_rate_limit burst=20 nodelay;

      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_core;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      # Apply same rate limit to non-websocket HTTP routes
      limit_req zone=api_rate_limit burst=20 nodelay;

      proxy_pass http://api_core;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
